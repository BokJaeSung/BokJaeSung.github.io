[[params.socialIcons]]
  name = 'github'
  title = 'GitHub'
  url = '#'

[[params.socialIcons]]
  name = 'email'
  title = 'Email'
  url = '#'

[[params.socialIcons]]
  name = 'rss'
  title = 'RSS'
  url = '#'

[menu]
  [[menu.main]]
    name = 'Posts'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    name = 'Tags'
    url = '/tags/'
    weight = 20
  [[menu.main]]
